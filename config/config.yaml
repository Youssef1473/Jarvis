# ==============================================================================
# Jarvis 2.0 Configuration
# ==============================================================================

llm:
  provider: "omniroute"           # Primary LLM provider: "omniroute" (gateway to 1200+ models), "groq", "gemini", or "grok"
  omniroute_base_url: "http://127.0.0.1:20128/v1" # Local OmniRoute proxy endpoint
  omniroute_model: "antigravity/claude-sonnet-4-6" # Primary active model (frontier intelligence)
  dynamic_tiering: true           # Smart Tiering: route routine OS/voice commands to fast LPU, deep tasks to Claude Sonnet
  fast_model: "groq/qwen/qwen3.8-27b" # Sub-200ms instant voice tier (volume, apps, device status, quick banter)
  deep_model: "antigravity/claude-sonnet-4-6" # Frontier intellect tier (coding, reasoning, analysis, planning)
  omniroute_fallback_models:      # Auto-switching cascade when quota / rate limits are hit:
    - "antigravity/claude-sonnet-4-6" # Tier 1: Claude Sonnet (Antigravity)
    - "kr/claude-sonnet-4.5"          # Tier 2: Claude Sonnet (Kiro)
    - "groq/qwen/qwen3.8-27b"         # Tier 3: Qwen 3.8 (Groq Cloud LPU)
  groq_model: "qwen/qwen3.8-27b"  # Groq Cloud model (instant 300ms inference)
  groq_fallback_models:           # Auto-switching cascade within Groq:
    - "qwen/qwen3.8-27b"
    - "llama-3.3-70b-versatile"
    - "llama-3.1-8b-instant"
  grok_model: "grok-2-latest"     # xAI Grok model ("grok-2-latest", "grok-2-vision-1212")
  model: "gemini-3.1-flash-lite"  # Google Gemini model (Ultimate fallback)
  temperature: 0.3
  max_output_tokens: 1024

audio:
  sample_rate: 16000
  channels: 1
  wake_word: "hey jarvis"
  wake_word_threshold: 0.55
  wake_word_energy_threshold: 0.0035 # Sub-microsecond RMS energy gate to skip idle ONNX inferences (0% idle CPU)
  ptt_trigger: "fin"              # Hold Fin (End) key to speak, release to send
  ptt_key: "fin"                  # Backward compatibility alias
  silence_threshold_seconds: 1.2  # Silence duration to conclude utterance

stt:
  model_size: "base.en"           # "base.en" (ultra-fast 15ms latency, ~140MB RAM), or "small" (480MB RAM)
  device: "cuda"                  # "cuda" with RTX 3050, or "cpu" fallback
  compute_type: "float16"         # "float16" for GPU, "int8" for CPU
  cpu_threads: 4                  # Limit STT threads on CPU to prevent CPU saturation
  language: "en"
  beam_size: 1                    # 1 for turbo real-time (sub-10ms), 3-5 for maximum beam search
  trim_silence: true              # Pre-trim leading/trailing silence before Whisper

tts:
  engine: "kokoro"                # "kokoro" (movie-grade neural voice), "sapi5", or "edge"
  kokoro_voice: "bm_george"       # "bm_george", "bm_lewis", "bm_daniel" (British JARVIS)
  kokoro_speed: 1.05              # Speech speed multiplier (0.8 - 1.5)
  kokoro_lang: "en-gb"            # "en-gb" (British English)
  cpu_threads: 4                  # Limit Kokoro ONNX synthesis threads to prevent 100% CPU spikes
  sapi_voice: "David"             # SAPI5 fallback voice
  sapi_rate: 1                    # SAPI5 fallback speech rate

sounds:
  enabled: true
  dir: "data/sounds"
  wake: "data/sounds/wake.wav"
  think: "data/sounds/think.wav"
  done: "data/sounds/done.wav"
  alert: "data/sounds/alert.wav"

safety:
  confirm_destructive: true       # Prompt voice confirmation for dangerous actions

memory:
  db_path: "data/jarvis_memory.db"

mcp:
  config_path: "config/mcp_servers.json"

heartbeat:
  enabled: true
  tick_interval_seconds: 30
  auto_morning_briefing: true
  calendar_alerts: true
  battery_alerts: true
  ergonomic_reminders: true
  email_notifications: true

ui:
  enabled: true                   # Holographic Web HUD interface
  host: "127.0.0.1"
  port: 20129
  auto_open: false                # Automatically launch browser on startup

hud:
  desktop_overlay: false          # Floating desktop transparent Tkinter overlay (disabled by default to prevent screen overlap)
