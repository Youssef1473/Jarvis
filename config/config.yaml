# ==============================================================================
# Jarvis 2.0 Configuration
# ==============================================================================

llm:
  provider: "omniroute"           # Primary LLM provider: "omniroute" (gateway to 1200+ models), "groq" (ultra-fast LPU), "gemini", or "grok"
  omniroute_base_url: "http://127.0.0.1:20128/v1" # Local OmniRoute proxy endpoint
  omniroute_model: "groq/qwen/qwen3.8-27b"        # Active model in OmniRoute (e.g. groq/qwen/qwen3.8-27b, deepseek, claude, gpt-4o)
  groq_model: "qwen/qwen3.8-27b"  # Groq Cloud model (instant 300ms inference)
  grok_model: "grok-2-latest"     # xAI Grok model ("grok-2-latest", "grok-2-vision-1212")
  model: "gemini-3.1-flash-lite"  # Google Gemini model
  temperature: 0.3
  max_output_tokens: 1024

audio:
  sample_rate: 16000
  channels: 1
  wake_word: "hey jarvis"
  wake_word_threshold: 0.55
  ptt_trigger: "fin"              # Hold Fin (End) key to speak, release to send
  ptt_key: "fin"                  # Backward compatibility alias
  silence_threshold_seconds: 1.2  # Silence duration to conclude utterance

stt:
  model_size: "small"             # "tiny", "base", "small", "medium"
  device: "cuda"                  # "cuda" with RTX 3050, or "cpu" fallback
  compute_type: "float16"         # "float16" for GPU, "int8" for CPU
  language: "en"

tts:
  engine: "kokoro"                # "kokoro" (movie-grade neural voice), "sapi5", or "edge"
  kokoro_voice: "bm_george"       # "bm_george", "bm_lewis", "bm_daniel" (British JARVIS)
  kokoro_speed: 1.05              # Speech speed multiplier (0.8 - 1.5)
  kokoro_lang: "en-gb"            # "en-gb" (British English)
  sapi_voice: "David"             # SAPI5 fallback voice
  sapi_rate: 1                    # SAPI5 fallback speech rate

sounds:
  enabled: true
  dir: "data/sounds"
  wake: "data/sounds/wake.wav"
  think: "data/sounds/think.wav"
  done: "data/sounds/done.wav"
  alert: "data/sounds/alert.wav"

safety:
  confirm_destructive: true       # Prompt voice confirmation for dangerous actions

memory:
  db_path: "data/jarvis_memory.db"

mcp:
  config_path: "config/mcp_servers.json"

heartbeat:
  enabled: true
  tick_interval_seconds: 30
  auto_morning_briefing: true
  calendar_alerts: true
  battery_alerts: true
  ergonomic_reminders: true
  email_notifications: true
